<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f0e6;color:#3a2a22;overflow:hidden}
.page{width:1080px;height:1920px;padding:90px 80px;position:relative;display:flex;flex-direction:column}
.top{width:56px;height:16px;background:#b8453a;margin-bottom:40px}
h1{font-size:72px;font-weight:900;letter-spacing:.06em}
.num{display:flex;align-items:baseline;gap:40px;margin-top:120px}
.num .n{font-size:150px;font-weight:200;color:#b8453a;line-height:1}
.num .t{font-size:64px;font-weight:900}
.meta{margin:34px 0 0 6px;font-size:30px;color:#5a4a3e;line-height:1.9}
.main{display:flex;gap:50px;margin-top:60px;align-items:flex-start}
.qrbox{text-align:center;flex-shrink:0}
.qrbox img{width:250px;height:250px;border:2px solid #d8c9ae;background:#fff;padding:8px}
.qrbox p{font-size:22px;margin-top:14px;color:#7a6a5a;letter-spacing:.1em}
.main .art{flex:1;display:flex;justify-content:center;align-items:center}
.main .art img{max-width:100%;max-height:560px;object-fit:contain}
.desc{margin-top:auto;font-size:29px;line-height:2.05;font-weight:300;color:#4a3a30}
.mark{position:absolute;right:80px;bottom:28px;font-size:24px;letter-spacing:.35em;color:#b8453a;font-weight:700}
</style>
</head>
<body>
<div class="page">
  <div class="top"></div>
  <h1>毕业作品展</h1>
  <div class="num"><span class="n">01</span><span class="t">铜梁祥龙</span></div>
  <div class="meta">作者：XXX &nbsp;|&nbsp; 指导老师：XXX<br>类别：IP形象设计 · 非遗文创</div>
  <div class="main">
    <div class="qrbox"><img src="images/qrcode.png"><p>扫码浏览作品</p></div>
    <div class="art"><img src="images/画板_1.png"></div>
  </div>
  <p class="desc">本设计以国家级非物质文化遗产「铜梁龙舞」为灵感源，提炼铜梁龙灯的龙角、火焰、鳞甲与梁平木版年画纹样，塑造稻草龙、荷花龙、火龙、竞技龙、水云龙、竹绑龙六位性格各异的Q版祥龙形象，并延展表情包、海报、邮票、信封等系列衍生，让百年龙舞以治愈萌态走进日常，实现非遗文化的年轻化传播与活态传承。</p>
  <div class="mark">铜梁祥龙 · 龙舞IP</div>
</div>
</body>
</html>
